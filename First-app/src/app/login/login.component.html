<section class="login-page">
  <div class="login-card">
    <div class="brand-mark" aria-hidden="true">EM</div>
    <p class="eyebrow">Employee Management</p>
    <h1>Welcome back</h1>
    <p class="intro">Sign in to access your admin workspace or employee portal.</p>

    @if (errorMessage) {
      <div class="alert alert-danger" role="alert">{{ errorMessage }}</div>
    }

    <form (ngSubmit)="login()">
      <div class="field-group">
        <label for="email">Work email</label>
        <input id="email" name="email" type="email" [(ngModel)]="email" placeholder="admin@company.com" autocomplete="username" required />
      </div>

      <div class="field-group">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" [(ngModel)]="password" placeholder="Enter your password" autocomplete="current-password" required />
      </div>

      <button class="login-button" type="submit">Sign in <span aria-hidden="true">&#8594;</span></button>
    </form>

    <p class="secure-note"><span aria-hidden="true">&#128274;</span> Use your assigned account credentials</p>
  </div>
</section>
