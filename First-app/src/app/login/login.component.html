<section class="login-card panel p-4 mx-auto mt-5" style="max-width: 420px;">
  <div class="text-center mb-4">
    <p class="text-uppercase text-secondary small mb-1 fw-semibold">Security</p>
    <h2 class="mb-0">Admin Login</h2>
  </div>

  @if (errorMessage) {
    <div class="alert alert-danger">{{ errorMessage }}</div>
  }

  <div class="mb-3">
    <label class="form-label">Email</label>
    <input class="form-control" type="email" [(ngModel)]="email" placeholder="admin@company.com" />
  </div>

  <div class="mb-3">
    <label class="form-label">Password</label>
    <input class="form-control" type="password" [(ngModel)]="password" placeholder="admin123" />
  </div>

  <button class="btn btn-primary w-100" type="button" (click)="login()">Login</button>
</section>
